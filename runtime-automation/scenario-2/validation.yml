---
- name: Validate Module 02 — Gateway Connectivity
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _kc_raw: "{{ (lookup('file', k8s_kubeconfig) | from_yaml) if (k8s_kubeconfig | default('')) != '' else {} }}"
    _token: >-
      {{ _kc_raw.users[0].user.token
         if (_kc_raw and (_kc_raw.users | default([])) | length > 0)
         else lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token') }}

  tasks:
    - name: Read namespace from service account
      ansible.builtin.slurp:
        src: /var/run/secrets/kubernetes.io/serviceaccount/namespace
      register: r_ns

    - name: Set namespace and CR name facts
      ansible.builtin.set_fact:
        current_namespace: "{{ _username }}-scenario-2"
        _raw_ns: "{{ r_ns.content | b64decode | trim }}"
        _username: >-
          {{ 'user-' + (r_ns.content | b64decode | trim | regex_replace('^showroom-', ''))
             if (r_ns.content | b64decode | trim).startswith('showroom-')
             else (r_ns.content | b64decode | trim | regex_replace('-scenario-[0-9]+$', '')) }}

    - name: Derive scenario namespace and CR name
      ansible.builtin.set_fact:
        aap_cr_name: "{{ _username }}-aap"

    - name: Check postgres-15 Service exists
      ansible.builtin.uri:
        url: "https://kubernetes.default.svc/api/v1/namespaces/{{ current_namespace }}/services/{{ aap_cr_name }}-postgres-15"
        method: GET
        headers:
          Authorization: "Bearer {{ _token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_postgres_svc

    - name: Check gateway operator deployment
      ansible.builtin.uri:
        url: "https://kubernetes.default.svc/apis/apps/v1/namespaces/{{ current_namespace }}/deployments/aap-gateway-operator-controller-manager"
        method: GET
        headers:
          Authorization: "Bearer {{ _token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_operator_dep

    - name: Check gateway pods
      ansible.builtin.uri:
        url: "https://kubernetes.default.svc/api/v1/namespaces/{{ current_namespace }}/pods?labelSelector=app.kubernetes.io%2Fcomponent%3Daap-gateway"
        method: GET
        headers:
          Authorization: "Bearer {{ _token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_gateway_pods

    - name: Evaluate checks
      ansible.builtin.set_fact:
        postgres_svc_exists: "{{ r_postgres_svc.status == 200 }}"
        operator_running: >-
          {{
            r_operator_dep.status == 200 and
            r_operator_dep.json.spec.replicas | default(0) | int >= 1
          }}
        gateway_pods_running: >-
          {{
            r_gateway_pods.status == 200 and
            r_gateway_pods.json['items'] | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
          }}

    - name: Validate all tasks
      validation_check:
        check: "{{ postgres_svc_exists and operator_running and gateway_pods_running }}"
        pass_msg: |
          ✅ Service {{ aap_cr_name }}-postgres-15 exists
          ✅ Gateway operator deployment has replicas >= 1
          ✅ Gateway pods Running
        error_msg: |
          {{ '✅' if postgres_svc_exists else '❌' }} Service {{ aap_cr_name }}-postgres-15 exists
          {{ '✅' if operator_running else '❌' }} Gateway operator deployment has replicas >= 1
          {{ '✅' if gateway_pods_running else '❌' }} Gateway pods Running
