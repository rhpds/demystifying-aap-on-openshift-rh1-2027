---
- name: Validate Module 06 — ALIA Lightspeed Configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _sa_token: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token') }}"

  tasks:
    - name: Read namespace from service account
      ansible.builtin.slurp:
        src: /var/run/secrets/kubernetes.io/serviceaccount/namespace
      register: r_ns

    - name: Set showroom namespace and derive username
      ansible.builtin.set_fact:
        _showroom_ns: "{{ r_ns.content | b64decode | trim }}"
        _username: >-
          {{ 'user-' + (r_ns.content | b64decode | trim | regex_replace('^showroom-', ''))
             if (r_ns.content | b64decode | trim).startswith('showroom-')
             else (r_ns.content | b64decode | trim | regex_replace('-scenario-[0-9]+$', '')) }}

    - name: Derive scenario namespace and CR name
      ansible.builtin.set_fact:
        current_namespace: "{{ _username }}-scenario-4"
        aap_cr_name: "{{ _username }}-aap"

    - name: Get runtime-automation cluster-admin token from showroom namespace
      ansible.builtin.uri:
        url: "https://kubernetes.default.svc/api/v1/namespaces/{{ _showroom_ns }}/secrets/runtime-automation-token"
        headers:
          Authorization: "Bearer {{ _sa_token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_ra_token

    - name: Set cluster-admin token
      ansible.builtin.set_fact:
        _token: >-
          {{ r_ra_token.json.data.token | b64decode
             if r_ra_token.status == 200
             else _sa_token }}

    - name: Get chatbot configuration secret
      ansible.builtin.uri:
        url: "https://kubernetes.default.svc/api/v1/namespaces/{{ current_namespace }}/secrets/chatbot-configuration-secret"
        method: GET
        headers:
          Authorization: "Bearer {{ _token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_chatbot_secret

    - name: Get AAP CR
      ansible.builtin.uri:
        url: "https://kubernetes.default.svc/apis/aap.ansible.com/v1alpha1/namespaces/{{ current_namespace }}/ansibleautomationplatforms/{{ aap_cr_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ _token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_aap_cr

    - name: Decode chatbot_model from secret
      ansible.builtin.set_fact:
        chatbot_model: "{{ r_chatbot_secret.json.data.chatbot_model | b64decode }}"
      when: r_chatbot_secret.status == 200

    - name: Evaluate checks
      ansible.builtin.set_fact:
        secret_exists: "{{ r_chatbot_secret.status == 200 }}"
        correct_model: "{{ (chatbot_model | default('')) == 'granite-3-2-8b-instruct' }}"
        lightspeed_enabled: >-
          {{
            r_aap_cr.status == 200 and
            (
              r_aap_cr.json.spec.lightspeed is not defined or
              r_aap_cr.json.spec.lightspeed.disabled | default(false) == false
            )
          }}

    - name: Validate all tasks
      validation_check:
        check: "{{ secret_exists and correct_model and lightspeed_enabled }}"
        pass_msg: |
          ✅ chatbot-configuration-secret exists
          ✅ chatbot_model = granite-3-2-8b-instruct
          ✅ Lightspeed is enabled in AAP CR
        error_msg: |
          {{ '✅' if secret_exists else '❌' }} chatbot-configuration-secret exists
          {{ '✅' if correct_model else '❌' }} chatbot_model = granite-3-2-8b-instruct (got: {{ chatbot_model | default('not found') }})
          {{ '✅' if lightspeed_enabled else '❌' }} Lightspeed is enabled in AAP CR
