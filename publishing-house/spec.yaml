spec:
  title: Demystifying Ansible Automation Platform on OpenShift Container Platform
  learning_objectives:
  - Troubleshoot Automation Hub pod scheduling failures by identifying an incompatible
    StorageClass and correcting the PVC access mode in the AAP Custom Resource.
  - Restore Automation Gateway authentication by diagnosing pod log output to identify
    credential mismatches and resetting the admin password using in-cluster management
    tooling.
  - Diagnose and resolve Kubernetes pod scheduling failures caused by an invalid node
    selector in the AAP Custom Resource database configuration.
  - Troubleshoot Ansible Lightspeed (ALIA) service failures by inspecting pod logs
    and Kubernetes Secrets to identify unauthorized LLM model configurations and restore
    connectivity to an external LLM endpoint.
  modules:
  - id: module-01
    title: Welcome and Lab Credentials
    duration_min: 10
    status: not_started
  - id: module-02
    title: 'Scenario 1: Automation Hub Storage Issue'
    duration_min: 20
    status: not_started
  - id: module-03
    title: 'Scenario 2: Gateway and Controller Login Issues'
    duration_min: 25
    status: not_started
  - id: module-04
    title: 'Scenario 3: Node Selector and Resource Issues'
    duration_min: 20
    status: not_started
  - id: module-05
    title: 'Scenario 4: ALIA — Ansible Lightspeed Issues'
    duration_min: 30
    status: not_started
  - id: module-06
    title: Conclusion
    duration_min: 5
    status: not_started
