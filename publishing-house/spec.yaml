approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: Zero-Touch lab with automated Solve and Validate buttons
      on all four scenario modules. Validate confirms environment recovery; pass on
      all four constitutes completion.
    catalog_gap: No existing catalog item covers AAP Operator operational troubleshooting
      on OpenShift from a support-and-services perspective. All four scenarios are
      drawn from real failure patterns observed by Red Hat Support in customer AAP
      deployments — giving practitioners hands-on experience with the exact issues
      they are most likely to encounter in production, not synthetic exercises. The
      existing catalog entry for this lab ran 4 scenarios at 90 min; this migration
      refines and formalizes it through the Publishing House lifecycle.
    design_overview: 'A hands-on troubleshooting lab where AAP administrators and
      platform engineers diagnose and recover four pre-broken Ansible Automation Platform
      deployments running on OpenShift. Each scenario targets a distinct failure class:
      Hub storage access mode, Gateway authentication, node selector misconfiguration,
      and Ansible Lightspeed LLM configuration.'
    module_summaries:
    - title: Welcome and Lab Credentials
      overview: Orientation module explaining the break-and-fix lab structure, student
        namespace layout, and credential access for all six AAP instances and the
        OpenShift Console.
    - title: 'Scenario 1: Automation Hub Storage Issue'
      overview: Students diagnose Automation Hub pods stuck Pending due to a ReadWriteOnly
        StorageClass and fix it by updating the AAP CR to use a CephFS RWX StorageClass.
    - title: 'Scenario 2: Gateway and Controller Login Issues'
      overview: Students trace an AAP Gateway login failure to an incorrect admin
        password, then reset it using the aap-gateway-manage utility inside the Gateway
        pod terminal.
    - title: 'Scenario 3: Node Selector and Resource Issues'
      overview: Students identify an invalid nodeSelector on the AAP CR database configuration
        that prevents PostgreSQL pods from scheduling, then correct or remove the
        selector to restore the deployment.
    - title: 'Scenario 4: ALIA — Ansible Lightspeed Issues'
      overview: Students trace a missing ALIA chat icon to an unauthorized LLM model
        configured in the chatbot secret, then restore the correct model and force
        reconciliation by restarting the Lightspeed operator and API pods.
    - title: Conclusion
      overview: Wrap-up summarizing the six scenarios and skills practiced, with links
        to AAP and OCP documentation.
    rcars_overlap_pct: 44
    rcars_top_matches:
