---
# Approves the AAP operator InstallPlan for the pinned startingCSV.
# installPlanApproval is Manual to prevent OLM from auto-upgrading to a
# newer CSV build that has a 256-core gateway proxy CPU limit bug.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.tenant.username }}-aap-approve-installplan
  namespace: {{ .Values.tenant.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: aap-break-sa
      volumes:
      - name: sa-token
        secret:
          secretName: aap-break-sa-token
      containers:
      - name: approve-installplan
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        volumeMounts:
        - name: sa-token
          mountPath: /var/run/secrets/break-sa
          readOnly: true
        command:
        - /bin/sh
        - -c
        - |
          NS="{{ .Values.tenant.namespace }}"
          TARGET_CSV="{{ .Values.aap.startingCSV }}"
          API="https://kubernetes.default.svc"
          TOKEN=$(cat /var/run/secrets/break-sa/token)

          echo "Waiting for InstallPlan containing $TARGET_CSV in $NS..."
          for i in $(seq 1 60); do
            IP_NAME=$(curl -sk \
              -H "Authorization: Bearer $TOKEN" \
              "$API/apis/operators.coreos.com/v1alpha1/namespaces/$NS/installplans" \
              | python3 -c "
import sys, json
d = json.load(sys.stdin)
for ip in d.get('items', []):
    csvs = ip.get('spec', {}).get('clusterServiceVersionNames', [])
    if '$TARGET_CSV' in csvs and not ip.get('spec', {}).get('approved', False):
        print(ip['metadata']['name'])
        break
" 2>/dev/null)

            if [ -n "$IP_NAME" ]; then
              echo "Found InstallPlan $IP_NAME — approving..."
              curl -sk -X PATCH \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/merge-patch+json" \
                "$API/apis/operators.coreos.com/v1alpha1/namespaces/$NS/installplans/$IP_NAME" \
                -d '{"spec":{"approved":true}}' > /dev/null
              echo "InstallPlan approved."
              exit 0
            fi

            echo "  not found yet ($i/60), retrying in 10s..."
            sleep 10
          done

          echo "Timed out waiting for InstallPlan."
          exit 1
