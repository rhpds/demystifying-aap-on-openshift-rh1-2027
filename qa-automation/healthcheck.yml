---
# HEALTHCHECK — Quick environment readiness check
# Verifies OCP API, Keycloak SSO, AAP gateways for all 4 scenarios, the
# ALIA/Lightspeed MaaS LLM endpoint (Scenario 4), and the Showroom pod.
# Should complete in under 60 seconds.

- name: Environment Health Check
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"

  vars:
    _token: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/token') }}"
    # External MaaS LLM endpoint backing ALIA/Lightspeed (Scenario 4).
    # Defaults to the value baked into the AAP chatbot secret; override via env
    # (alia_llm_endpoint) if the tenant points at a different MaaS endpoint.
    alia_llm_endpoint: >-
      {{ lookup('env', 'alia_llm_endpoint')
         | default('https://litellm-prod.apps.maas.redhatworkshops.io/v1', true) }}

  tasks:
    - name: Read pod namespace
      ansible.builtin.slurp:
        src: /var/run/secrets/kubernetes.io/serviceaccount/namespace
      register: r_ns

    - name: Set pod namespace fact
      ansible.builtin.set_fact:
        pod_namespace: "{{ r_ns.content | b64decode | trim }}"

    - name: Derive username from namespace
      ansible.builtin.set_fact:
        username: >-
          {{ 'user-' + (r_ns.content | b64decode | trim | regex_replace('^showroom-', ''))
             if (r_ns.content | b64decode | trim).startswith('showroom-')
             else (r_ns.content | b64decode | trim | regex_replace('-scenario-[0-9]+$', '')) }}

    - name: Set ingress domain from Showroom env var
      ansible.builtin.set_fact:
        ingress_domain: "{{ lookup('env', 'openshift_apps_domain') }}"

    - name: "Check: OCP API reachable"
      ansible.builtin.debug:
        msg: "OCP API OK — ingress domain: {{ ingress_domain }}"

    - name: "Check: Keycloak SSO responding"
      ansible.builtin.uri:
        url: "https://sso.{{ ingress_domain }}/realms/master"
        validate_certs: false
        status_code: 200
        timeout: 15

    - name: "Check: AAP gateway responding for each scenario"
      ansible.builtin.uri:
        url: "https://{{ username }}-aap-{{ username }}-scenario-{{ item }}.{{ ingress_domain }}/api/controller/v2/ping/"
        validate_certs: false
        status_code: [200, 401]
        timeout: 15
      loop: "{{ range(1, 5) | list }}"

    - name: "Check: ALIA / Lightspeed MaaS LLM endpoint reachable (Scenario 4)"
      ansible.builtin.uri:
        url: "{{ alia_llm_endpoint }}"
        method: GET
        validate_certs: false
        # Unauthenticated probe: endpoint is up if it answers, even with 401/403/404.
        status_code: [200, 401, 403, 404]
        timeout: 15

    - name: "Check: list pods in Showroom namespace"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ pod_namespace }}"
      register: r_showroom_pods

    - name: "Check: a Showroom pod is Running"
      ansible.builtin.assert:
        that:
          - >-
            r_showroom_pods.resources
            | selectattr('metadata.name', 'search', 'showroom')
            | selectattr('status.phase', 'equalto', 'Running')
            | list | length > 0
        fail_msg: "No Running Showroom pod found in namespace {{ pod_namespace }}"
        success_msg: "Showroom pod is Running in namespace {{ pod_namespace }}"

    - name: Report all checks passed
      ansible.builtin.debug:
        msg: >-
          Health check passed — OCP API, Keycloak SSO, AAP gateways (scenarios 1-4),
          ALIA/Lightspeed MaaS LLM endpoint, and the Showroom pod all responding.
